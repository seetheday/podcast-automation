<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Where humans stay in control</title>
  <desc id="desc">Diagram showing humans leading research and pacing with AI assistance for leveling and metadata.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 2; rx: 12; }
    .label { font: 14px/1.2 "Inter", system-ui, -apple-system, sans-serif; fill: currentColor; }
    .small { font-size: 13px; }
    .arrow { stroke: currentColor; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect class="box" x="190" y="20" width="380" height="70" />
  <text class="label" x="380" y="45" text-anchor="middle">
    <tspan x="380" dy="0">Human Research, narrative, recording</tspan>
  </text>

  <rect class="box" x="60" y="140" width="300" height="80" />
  <text class="label small" x="210" y="170" text-anchor="middle">
    <tspan x="210" dy="0">AI assistance — Leveling,</tspan>
    <tspan x="210" dy="18">cleanup, detection</tspan>
  </text>

  <rect class="box" x="400" y="140" width="300" height="80" />
  <text class="label small" x="550" y="170" text-anchor="middle">
    <tspan x="550" dy="0">AI assistance — Metadata,</tspan>
    <tspan x="550" dy="18">linting, validation</tspan>
  </text>

  <rect class="box" x="220" y="270" width="320" height="70" />
  <text class="label" x="380" y="300" text-anchor="middle">
    <tspan x="380" dy="0">Human craft — Pacing</tspan>
  </text>

  <rect class="box" x="220" y="350" width="320" height="60" />
  <text class="label" x="380" y="383" text-anchor="middle">Release-ready episode</text>

  <line class="arrow" x1="380" y1="90" x2="210" y2="140" />
  <line class="arrow" x1="380" y1="90" x2="550" y2="140" />
  <line class="arrow" x1="210" y1="220" x2="320" y2="270" />
  <line class="arrow" x1="550" y1="220" x2="440" y2="270" />
  <line class="arrow" x1="380" y1="340" x2="380" y2="350" />
</svg>
